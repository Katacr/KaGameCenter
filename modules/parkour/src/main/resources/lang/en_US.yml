  admin_help: |-
    §6Parkour Admin Commands
    §e/{0} admin parkour reload §7Reload parkour config
    §e/{0} admin parkour edit <map> §7Create an editor world and enter edit mode
    §e/{0} admin parkour saveedit [map] §7Save the current editor world back to the template folder
    §e/{0} admin parkour closeedit [map] §7Save and close the editor world
    §e/{0} admin parkour maps §7List maps
    §e/{0} admin parkour routes <map> §7List routes
    §e/{0} admin parkour setlobby <map> <route> §7Set waiting lobby
    §e/{0} admin parkour setstart <map> <route> §7Set start spawn
    §e/{0} admin parkour setstartregion <map> <route> §7Set start region from current selection
    §e/{0} admin parkour addcheckpoint <map> <route> <id> §7Add checkpoint from current selection, current position as respawn
    §e/{0} admin parkour addcheckpoint [number] §7Add a checkpoint in the current managed game editor world; auto-numbered when omitted
    §e/{0} admin parkour setfinish <map> <route> §7Set finish region from current selection
    §e/{0} admin parkour removecheckpoint <map> <route> <id> §7Remove checkpoint
    §e/{0} admin parkour removecheckpoint <number> §7Remove a checkpoint from the current managed game editor world
    §e/{0} admin parkour addspeedbuff <map> <route> <id> §7Add Speed II pickup at current position
    §e/{0} admin parkour removebuff <map> <route> <id> §7Remove pickup
    §e/{0} admin parkour preview §7Preview current selection
    §e/{0} admin parkour previewall <map> <route> §7Preview all checkpoints and the finish of a route
