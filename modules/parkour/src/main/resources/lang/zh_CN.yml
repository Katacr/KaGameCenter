  admin_help: |-
    §6跑酷管理指令
    §e/{0} admin parkour reload §7重载跑酷配置
    §7以下指令需在托管游戏私有编辑世界内使用
    §e/{0} admin parkour setlobby §7设置等待大厅
    §e/{0} admin parkour setstart §7设置起点出生点
    §e/{0} admin parkour setstartregion §7用当前选区设置起点区域
    §e/{0} admin parkour addcheckpoint [编号] §7在当前托管游戏编辑世界中添加检查点，不填则自动使用数字编号
