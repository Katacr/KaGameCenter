Title: "{menu.member_title}"

Settings:
  can_escape: true
  after_action: "NONE"

Body:
  intro:
    type: "message"
    width: 320
    text:
      - "{menu.member_tooltip}"
      - "{menu.member_state_owner}"

Bottom:
  type: "multi"
  columns: 2
  buttons:
    transfer_owner:
      text: "{menu.button_transfer_owner}"
      actions:
        - "{member.transfer_action}"
    kick:
      text: "{menu.button_kick_player}"
      actions:
        - "{member.kick_action}"
  exit:
    text: "{menu.button_back}"
    actions:
      - "{room.refresh_action}"
